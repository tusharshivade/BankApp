<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('fincore-theme') || localStorage.getItem('color-scheme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches) || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) {
            meta.content = (!saved || saved === 'system') ? 'light dark' : saved;
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="FinCore Bank of India — Scheduled Commercial Digital Bank with instant UPI 2.0, RuPay cards, and high-yield Fixed Deposits regulated by RBI." />
    <title>FinCore Bank of India — Digital Banking Portal (RBI Regulated)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
